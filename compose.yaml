services:
  migrate:
    build:
      context: .
      target: production
    environment:
      DATA_DIRECTORY: /data
    volumes:
      - sqlite-data:/data
    command: ["node", "dist/server/migrate.mjs"]
    restart: "no"

  application:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?}
      DATA_DIRECTORY: /data
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-droch_session}
    volumes:
      - sqlite-data:/data
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  sqlite-data:
