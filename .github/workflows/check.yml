name: Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - parallel:
          - name: Build production image
            run: pnpm test:image
          - name: Install browser and system dependencies
            run: pnpm exec playwright install --with-deps chromium
      - name: Start production test stack
        id: test_stack
        run: |
          pnpm test:stack
          cat .local/test/browser.env >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      # Report the existing accessibility backlog without blocking functional CI.
      - name: Audit accessibility with axe (non-blocking)
        id: a11y
        if: ${{ !cancelled() && steps.test_stack.outcome == 'success' }}
        continue-on-error: true
        env:
          TEST_AUTH_MODE: local
        run: pnpm test:a11y
      - name: Upload accessibility report
        if: ${{ !cancelled() && steps.test_stack.outcome == 'success' && steps.a11y.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: axe-accessibility-report
          path: |
            playwright-report/a11y/
            test-results/a11y/
          retention-days: 14
      - name: Summarize accessibility audit
        if: ${{ !cancelled() && steps.test_stack.outcome == 'success' && steps.a11y.outcome != 'skipped' }}
        env:
          AXE_OUTCOME: ${{ steps.a11y.outcome }}
        run: |
          if [ "$AXE_OUTCOME" = "failure" ]; then
            echo "::warning::Axe accessibility audit reported findings or failed. Download axe-accessibility-report for details."
          fi
          printf '### Axe accessibility audit\n\nOutcome: %s. This audit is currently non-blocking while known markup findings remain.\n\nDownload the axe-accessibility-report artifact for the HTML report, raw results, screenshots and traces.\n' "$AXE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: pnpm test:stack:stop
