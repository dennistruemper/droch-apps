name: Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Identify production test image
        id: test-image
        run: echo "image=$(pnpm exec tsx tooling/test-stack.ts image)" >> "$GITHUB_OUTPUT"
      - parallel:
          - name: Build production image
            uses: docker/build-push-action@v7
            with:
              context: .
              target: production
              load: true
              tags: ${{ steps.test-image.outputs.image }}
              cache-from: type=gha,scope=production-test
              cache-to: type=gha,scope=production-test,mode=max
          - name: Install browser and system dependencies
            run: pnpm exec playwright install --with-deps chromium
      - name: Start production test stack
        run: |
          pnpm test:stack
          cat .local/test/browser.env >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - if: always()
        run: pnpm test:stack:stop
